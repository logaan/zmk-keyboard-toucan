CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Toucan2's Azoteq TPS43 replaces the V1 SPI/Cirque trackpad.
CONFIG_I2C=y
CONFIG_INPUT_TPS43=y

CONFIG_ZMK_BATTERY_REPORTING=y

# The TPS43 uses its own low-power modes while idle, and suspends on deep sleep.
# Do not enable the driver's idle-sleep property: it prevents touch-only wake.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_INPUT_THREAD_STACK_SIZE=2048
