CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Allow the measured LF-clock drift on the XIAO Prospector. This declares
# BLE sleep-clock accuracy; it does not change the clock source.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Keymap/Braille and Studio live on whichever device is the central.
CONFIG_ZMK_FEATURE_BRAILLE=y
CONFIG_ZMK_STUDIO=y

# Keep the heap budget that fixed battery fades on hardware (upstream issue #7).
CONFIG_LV_Z_MEM_POOL_SIZE=32768
# The new screens double-buffer by default. Two quarter-screen buffers keep
# their combined size at half a screen, leaving RAM for the heap and stack.
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192

# Original Toucan braille dashboard (companion toucan_braille_ui shield).
CONFIG_PROSPECTOR_STATUS_SCREEN_BRAILLE=y

# Works on kits without the optional APDS9960, too. Enable the sensor instead
# if fitted; see the Prospector module's configuration documentation.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50

# Original dashboard renders the on-device binding editor.
CONFIG_ZMK_BRAILLE_SETTINGS_UI=y

# Include all three selectable Braille translation modes.
CONFIG_ZMK_BRAILLE_GRADE2=y

# Preview and editor snapshots share the serialized central work queue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
