CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Keymap/Braille and Studio live on whichever device is the central.
CONFIG_ZMK_FEATURE_BRAILLE=y
CONFIG_ZMK_STUDIO=y

# The default 10 KB LVGL heap cannot allocate the battery fade's temporary
# layers (observed on hardware; prospector-zmk-module issue #7).
CONFIG_LV_Z_MEM_POOL_SIZE=32768
# The ST7789V supports partial writes. Halve the static framebuffer to leave
# RAM headroom for the larger heap, display stack and optional USB diagnostics.
CONFIG_LV_Z_VDB_SIZE=50
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Works on kits without the optional APDS9960, too. Enable the sensor instead
# if fitted; see the Prospector module's configuration documentation.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50
