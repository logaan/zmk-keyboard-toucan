# This is a separate firmware target: leave the standalone left config intact.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Use the upstream nice!view peripheral battery/connection screen, not the
# central-only nice_view_gem widgets. Full keyboard status is on the Prospector.
CONFIG_ZMK_DISPLAY=y
