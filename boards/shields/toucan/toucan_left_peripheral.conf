# This is a separate firmware target: leave the standalone left config intact.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Keep nice_view_gem's Toucan-specific 144x168 panel definition, but use ZMK's
# built-in peripheral battery/connection widgets, not the central-only screen.
# The stock nice_view shield is a different 160x68 panel and corrupts this LCD.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
