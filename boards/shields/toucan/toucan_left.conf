CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Idle after 30 seconds; deep sleep after one hour.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Input behaviors (TAP, zoom and swipes) need more than the default 512 bytes.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Toucan2 display styles: 0 = original, 1 = Toucan logo, 2 = WPM graph.
CONFIG_TOUCAN_STATUS_SCREEN=2
CONFIG_ZMK_STUDIO=y

# Braille input processing is central-only; the right half forwards positions.
CONFIG_ZMK_FEATURE_BRAILLE=y
