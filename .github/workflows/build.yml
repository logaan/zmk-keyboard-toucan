name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check firmware helpers (no hardware required)
        run: |
          bash -n scripts/build-and-load
          python3 -m unittest discover -s tests -v

  build:
    # Keep the build environment in sync with config/west.yml (Zephyr 4.1).
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
    with:
      archive_name: qbf-toucan-firmware-build-${{ github.run_number }}

  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install keymap-drawer
        # Pin tree-sitter + grammar to a matched, working pair: tree-sitter 0.25
        # dropped Query.captures (used by keymap-drawer 0.21) and the 0.15 grammar
        # needs a newer ABI than 0.24 supports.
        run: pip install "keymap-drawer==0.21.0" "tree-sitter~=0.24.0" "tree-sitter-devicetree~=0.14.0"

      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render keymap drawing (PDF)
        run: |
          keymap parse -z config/toucan.keymap -c 12 -o config/toucan.keymap.yaml
          keymap draw config/toucan.keymap.yaml -j config/toucan.json -o config/toucan.svg
          rsvg-convert -f pdf config/toucan.svg -o config/toucan.pdf

      - name: Upload keymap drawing
        uses: actions/upload-artifact@v4
        with:
          name: qbf-toucan-keymap-build-${{ github.run_number }}
          path: config/toucan.pdf
